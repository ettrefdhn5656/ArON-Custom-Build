name: Build ArON Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore v2rayN/v2rayN.sln

      - name: Build Windows x64
        run: |
          dotnet publish v2rayN/v2rayN/v2rayN.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o ./publish-win-x64

      - name: Archive build artifacts
        run: |
          Compress-Archive -Path ./publish-win-x64/* -DestinationPath ./ArON-Windows-x64.zip

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArON-Windows-x64
          path: ./ArON-Windows-x64.zip
